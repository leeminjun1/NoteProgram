<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✏️ 비밀 일기 작성</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: linear-gradient(to right top, #f0f4ff, #e7f8f1);
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .form-wrapper {
      background-color: white;
      padding: 2.5rem;
      border-radius: 1rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 600px;
      animation: slideIn 0.4s ease-in-out;
    }

    h2 {
      text-align: center;
      font-weight: bold;
      margin-bottom: 1.5rem;
      color: #333;
    }

    .form-label {
      font-weight: 500;
      color: #555;
    }

    .btn-primary {
      background-color: #4a69bd;
      border: none;
    }

    .btn-primary:hover {
      background-color: #3b5b9b;
    }

    .btn-secondary {
      background-color: #a5a5a5;
      border: none;
    }

    .btn-secondary:hover {
      background-color: #888;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="form-wrapper">
    <h2>✏️ 비밀 일기 작성</h2>
    <form id="writeForm">
      <div class="mb-3">
        <label for="title" class="form-label">제목</label>
        <input type="text" id="title" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="content" class="form-label">내용</label>
        <textarea id="content" class="form-control" rows="8" required></textarea>
      </div>
      <div class="d-flex justify-content-between">
        <button type="submit" class="btn btn-primary">저장</button>
        <a href="index.html" class="btn btn-secondary">돌아가기</a>
      </div>
    </form>
  </div>

  <script>
    const writeForm = document.getElementById('writeForm');

    writeForm.addEventListener('submit', function (e) {
      e.preventDefault();

      const title = document.getElementById('title').value.trim();
      const content = document.getElementById('content').value.trim();

      if (!title || !content) return;

      const newNote = {
        id: Date.now(),
        title,
        content
      };

      const existingNotes = JSON.parse(localStorage.getItem('diaryNotes')) || [];
      existingNotes.unshift(newNote);
      localStorage.setItem('diaryNotes', JSON.stringify(existingNotes));

      window.location.href = 'index.html';
    });
  </script>
</body>
</html>

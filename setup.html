<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>비밀번호 설정</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
    }
    .setup-card {
      background: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
      width: 100%;
      max-width: 400px;
    }
    h2 {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    input[type="password"] {
      width: 100%;
      padding: 0.8rem;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      width: 100%;
      padding: 0.8rem;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #218838;
    }
  </style>
</head>
<body>
  <div class="setup-card">
    <h2>🔐 비밀번호 설정</h2>
    <input type="password" id="new-password" placeholder="비밀번호 입력" />
    <input type="password" id="confirm-password" placeholder="비밀번호 확인" />
    <button onclick="savePassword()">설정 완료</button>
  </div>

  <script>
    // 이미 비밀번호가 있으면 로그인 화면으로 보냄
    if (localStorage.getItem("diaryPassword")) {
      window.location.href = "note.html";
    }
  
    async function hashPassword(password) {
      const encoder = new TextEncoder();
      const data = encoder.encode(password);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }
  
    async function savePassword() {
      const pw1 = document.getElementById("new-password").value;
      const pw2 = document.getElementById("confirm-password").value;
  
      if (!pw1 || !pw2) {
        alert("비밀번호를 모두 입력해주세요");
        return;
      }
  
      if (pw1 !== pw2) {
        alert("비밀번호가 일치하지 않습니다");
        return;
      }
  
      const hashedPw = await hashPassword(pw1);
      localStorage.setItem("diaryPassword", hashedPw);
      alert("비밀번호 설정이 완료되었습니다.");
      window.location.href = "note.html";
    }
  </script>
  
</body>
</html>

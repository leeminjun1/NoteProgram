<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>✏️ 새 일기 작성</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      background: linear-gradient(to right, #e0f7fa, #e0eafc);
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .form-card {
      background: white;
      border-radius: 1rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      padding: 2.5rem;
      width: 100%;
      max-width: 600px;
      animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      font-weight: bold;
      text-align: center;
      margin-bottom: 1.5rem;
      color: #4a4a4a;
    }

    .form-control:focus {
      border-color: #80bdff;
      box-shadow: 0 0 0 0.2rem rgba(0,123,255,.25);
    }

    .btn {
      padding: 0.6rem 1.2rem;
      font-weight: 500;
    }

    .btn-success {
      background-color: #28a745;
      border-color: #28a745;
    }

    .btn-secondary {
      background-color: #6c757d;
      border-color: #6c757d;
    }
  </style>
</head>
<body>
  <div class="form-card">
    <h2>📔 새 일기 작성</h2>
    <form id="writeForm">
      <div class="mb-3">
        <label for="title" class="form-label">제목</label>
        <input type="text" id="title" class="form-control" required />
      </div>
      <div class="mb-3">
        <label for="content" class="form-label">내용</label>
        <textarea id="content" class="form-control" rows="6" required></textarea>
      </div>
      <div class="d-flex justify-content-between">
        <button type="submit" class="btn btn-success">저장</button>
        <a href="index.html" class="btn btn-secondary">취소</a>
      </div>
    </form>
  </div>

  <script>
    const writeForm = document.getElementById('writeForm');

    writeForm.addEventListener('submit', function (e) {
      e.preventDefault();

      const title = document.getElementById('title').value.trim();
      const content = document.getElementById('content').value.trim();

      if (!title || !content) return;

      const newNote = {
        id: Date.now(),
        title,
        content,
        createdAt: new Date().toISOString()
      };

      const existingNotes = JSON.parse(localStorage.getItem('diaryNotes')) || [];
      existingNotes.unshift(newNote);
      localStorage.setItem('diaryNotes', JSON.stringify(existingNotes));

      window.location.href = 'note.html';
    });
  </script>
</body>
</html>
